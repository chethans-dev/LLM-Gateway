server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA has no router, but a refresh on any path should still work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the gateway.
    #
    # This is why there is no CORS configuration in the project: the browser only
    # ever talks to nginx, and nginx talks to the gateway over the compose
    # network. The gateway never needs to know the dashboard's origin.
    location /v1/ {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The dashboard only reads JSON, but this location also covers the
        # gateway's streaming endpoint if someone points a client here. Buffering
        # would turn a token-by-token response into one delivery at the end —
        # the same reason the gateway sends x-accel-buffering: no.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
